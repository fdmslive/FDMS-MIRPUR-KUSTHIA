<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2E7D32">
<title>৪০৪ — পেজ পাওয়া যায়নি | উপজেলা সার বিতরণ ব্যবস্থাপনা সিস্টেম</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#2E7D32;
    --primary-dark:#1B5E20;
    --secondary:#4CAF50;
    --secondary-light:#81C784;
    --gold:#C9A227;
    --bg:#F5F7F5;
    --text-dark:#1B2B1E;
    --text-muted:#5C6B5E;
    --border:rgba(46,125,50,0.16);
    --glass:rgba(255,255,255,0.72);
    --radius:14px;
    --shadow:0 4px 18px rgba(27,94,32,0.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Hind Siliguri',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--text-dark);
    background:
      radial-gradient(900px 500px at 100% -10%, rgba(46,125,50,0.09), transparent),
      radial-gradient(700px 500px at -10% 110%, rgba(201,162,39,0.10), transparent),
      var(--bg);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header{
    display:flex;align-items:center;gap:10px;
    padding:14px 20px;
    font-weight:600;font-size:15px;color:var(--primary-dark);
  }
  header .dot{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    display:grid;place-items:center;color:#fff;box-shadow:var(--shadow);
  }
  main{
    flex:1;display:grid;place-items:center;padding:20px;
  }
  .card{
    width:100%;max-width:520px;
    background:var(--glass);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:0 10px 40px rgba(27,94,32,0.10);
    padding:36px 28px 30px;
    text-align:center;
  }
  .art{width:180px;height:auto;margin:0 auto 6px;display:block;}
  .code{
    font-size:76px;font-weight:700;line-height:1;margin:4px 0 6px;
    letter-spacing:2px;
    background:linear-gradient(135deg,var(--primary-dark),var(--secondary));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  h1{font-size:22px;margin:0 0 8px;font-weight:700;}
  p{margin:0 0 6px;color:var(--text-muted);font-size:15px;line-height:1.7;}
  .path{
    display:inline-block;max-width:100%;
    margin:10px 0 4px;padding:6px 12px;border-radius:8px;
    background:rgba(46,125,50,0.07);border:1px dashed var(--border);
    font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--primary-dark);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 20px;border-radius:12px;
    font:600 15px 'Hind Siliguri',sans-serif;
    text-decoration:none;cursor:pointer;border:1px solid transparent;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    color:#fff;box-shadow:0 6px 16px rgba(46,125,50,0.25);
  }
  .btn-primary:hover{box-shadow:0 8px 22px rgba(46,125,50,0.32);}
  .btn-ghost{background:#fff;color:var(--primary-dark);border-color:var(--border);}
  .btn-ghost:hover{background:rgba(46,125,50,0.06);}
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .hint{margin-top:18px;font-size:13px;color:var(--text-muted);}
  footer{text-align:center;padding:16px;font-size:12.5px;color:var(--text-muted);}
  @keyframes sway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
  .leaf{transform-origin:90px 120px;animation:sway 4s ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){.leaf{animation:none;}}
  @media (max-width:420px){.code{font-size:60px;}h1{font-size:19px;}.card{padding:28px 18px 24px;}}
</style>
</head>
<body>
  <header>
    <span class="dot" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12"/><path d="M12 12C12 7 8 4 3 4c0 5 4 8 9 8z"/><path d="M12 14c0-4 3-7 8-7 0 4-3 7-8 7z"/></svg>
    </span>
    উপজেলা সার বিতরণ ব্যবস্থাপনা সিস্টেম
  </header>

  <main>
    <section class="card" role="main" aria-labelledby="t">
      <svg class="art" viewBox="0 0 180 130" aria-hidden="true">
        <ellipse cx="90" cy="122" rx="62" ry="7" fill="rgba(27,94,32,0.10)"/>
        <path d="M40 120 Q90 108 140 120" stroke="#8D6E63" stroke-width="5" fill="none" stroke-linecap="round"/>
        <g class="leaf">
          <path d="M90 120 V62" stroke="#2E7D32" stroke-width="4" stroke-linecap="round"/>
          <path d="M90 88 C70 88 56 76 52 58 C72 58 86 68 90 88Z" fill="#4CAF50"/>
          <path d="M90 74 C108 74 122 62 126 44 C106 44 92 54 90 74Z" fill="#81C784"/>
          <circle cx="90" cy="56" r="7" fill="#C9A227"/>
        </g>
        <text x="148" y="40" font-size="22" font-weight="700" fill="#C9A227" font-family="Hind Siliguri,sans-serif">?</text>
      </svg>

      <div class="code">৪০৪</div>
      <h1 id="t">দুঃখিত, পেজটি পাওয়া যায়নি</h1>
      <p>আপনি যে ঠিকানায় যেতে চেয়েছেন সেটি নেই, সরিয়ে নেওয়া হয়েছে, অথবা লিংকটি ভুল।</p>
      <div class="path" id="badPath" title=""></div>

      <div class="actions">
        <a class="btn btn-primary" href="/">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          হোম পেজে যান
        </a>
        <button class="btn btn-ghost" type="button" id="backBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          আগের পেজে ফিরুন
        </button>
      </div>

      <p class="hint" id="countdown"></p>
    </section>
  </main>

  <footer>© <span id="yr"></span> উপজেলা কৃষি অফিস · Page not found (404)</footer>

<script>
  (function () {
    var bn = function (n) { return String(n).replace(/\d/g, function (d) { return '০১২৩৪৫৬৭৮৯'[d]; }); };
    document.getElementById('yr').textContent = bn(new Date().getFullYear());

    var p = decodeURIComponent(location.pathname + location.search);
    var el = document.getElementById('badPath');
    if (p && p !== '/') { el.textContent = p; el.title = p; } else { el.style.display = 'none'; }

    var back = document.getElementById('backBtn');
    var canGoBack = history.length > 1 && document.referrer && document.referrer.indexOf(location.origin) === 0;
    back.addEventListener('click', function () { canGoBack ? history.back() : (location.href = '/'); });

    // ১৫ সেকেন্ড পর স্বয়ংক্রিয়ভাবে হোমে নিয়ে যাওয়া (কোনো বাটনে চাপলে বা মাউস নাড়ালে বন্ধ)
    var left = 15, cd = document.getElementById('countdown'), timer;
    function tick() {
      cd.textContent = bn(left) + ' সেকেন্ড পর স্বয়ংক্রিয়ভাবে হোম পেজে নিয়ে যাওয়া হবে।';
      if (left-- <= 0) { clearInterval(timer); location.href = '/'; }
    }
    function stop() { clearInterval(timer); cd.textContent = ''; ['click','keydown','touchstart'].forEach(function (e) { document.removeEventListener(e, stop); }); }
    tick(); timer = setInterval(tick, 1000);
    ['click','keydown','touchstart'].forEach(function (e) { document.addEventListener(e, stop, { once: true }); });
  })();
</script>
</body>
</html>
